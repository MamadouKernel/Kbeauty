proxy_request_buffering off;
proxy_read_timeout 120s;
# The API sets the same security headers as this proxy: keep one copy of each (the proxy's) instead of a doubled value.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_pass $api_upstream;
proxy_set_header Host $host;
# The client address nginx itself established (the connecting peer, or the real client behind a trusted proxy: see real-ip.inc), never a value the
# client supplied: the API reads the LAST entry, so a client-supplied prefix must not survive.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $fwd_proto;

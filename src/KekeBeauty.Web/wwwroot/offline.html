<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#410060"><title>Keke Beauty — Hors connexion</title><link rel="stylesheet" href="/app.css"><style>body{margin:0;background:#fcf9f7;color:#32153f;font-family:Arial,sans-serif}.offline{min-height:100dvh;display:grid;place-items:center;padding:24px}.offline-card{width:min(520px,100%);padding:32px;border:1px solid #e8deea;border-radius:28px;background:#fff;box-shadow:0 20px 60px #3a0d5217;text-align:center}.offline-card img{width:88px;height:88px;object-fit:contain}.offline-card h1{font-size:32px;margin:20px 0 8px}.offline-card p{color:#756879;line-height:1.6}.offline-card button{min-height:48px;margin-top:18px;padding:0 22px;border:0;border-radius:999px;background:#410060;color:#fff;font-weight:700}.snapshot{margin-top:24px;text-align:left}.snapshot article{padding:14px 0;border-top:1px solid #e8deea}.snapshot strong,.snapshot span{display:block}.snapshot span{margin-top:4px;color:#756879;font-size:13px}</style></head><body><main class="offline"><section class="offline-card"><img src="/img/logo.png" alt="Keke Beauty"><h1>Vous êtes hors connexion</h1><p>Vos dernières informations utiles restent disponibles. La plateforme se reconnectera automatiquement dès le retour du réseau.</p><button onclick="location.reload()">Réessayer</button><div id="snapshot" class="snapshot"></div></section></main><script>const root=document.getElementById('snapshot');try{const saved=JSON.parse(localStorage.getItem('keke-client-snapshot'));const items=Array.isArray(saved?.value)?saved.value:[];if(items.length){root.innerHTML='<h2>Derniers rendez-vous enregistrés</h2>'+items.slice(0,5).map(x=>`<article><strong>${x.libellePrestation||'Rendez-vous'}</strong><span>${x.nomEtablissement||''} · ${new Date(x.dateHeureDebut).toLocaleString('fr-FR')}</span></article>`).join('')}}catch{}</script></body></html>

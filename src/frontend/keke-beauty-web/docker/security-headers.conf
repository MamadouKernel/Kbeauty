# Included by every location that sets its own add_header (nginx does not inherit add_header across levels).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_google_script; style-src 'self' 'unsafe-inline' $csp_google_style; frame-src 'self' $csp_google_frame; img-src 'self' data: blob: $csp_map_tiles; font-src 'self' data:; connect-src 'self' wss://$host ws://$host $csp_google_connect; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Empty (header omitted) unless the request reached the proxy over HTTPS.
add_header Strict-Transport-Security $hsts_header always;

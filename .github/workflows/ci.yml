name: ci
on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore KekeBeauty.slnx
      - run: dotnet build KekeBeauty.slnx -c Release --no-restore --warnaserror
      - run: dotnet test tests/KekeBeauty.Api.Tests/KekeBeauty.Api.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"
      - name: Reject vulnerable dependencies
        shell: bash
        run: |
          output="$(dotnet list KekeBeauty.slnx package --vulnerable --include-transitive)"
          echo "$output"
          ! grep -qE 'High|Critical|Élevée|Critique' <<< "$output"
      - run: docker compose config --quiet
      - run: docker compose build api web
name: keke-beauty

# Local stack (PRD §4): PostGIS, MinIO (S3-compatible), API, web.
# Credentials below are development defaults only; override through a .env file (see .env.example).
services:
  postgres:
    # PostGIS on Debian 13 (maintained). The previous image (16-3.4, Debian 11, end of support) had 152 fixable HIGH/CRITICAL OS vulnerabilities, this one 25
    # (all in the Go helper `gosu`, not network exposed). Moving to another Debian changes text sorting rules: never reuse an old data volume,
    # restore a dump into a new one (scripts/backup-postgres.sh, scripts/verify-restore.sh).
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: kekebeauty
      POSTGRES_USER: keke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env - run sh scripts/init-env.sh}
    ports:
      # 5434 on the host: 5432/5433 are commonly taken by other local PostgreSQL containers.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_d13:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keke -d kekebeauty"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Chainguard's maintained, minimal MinIO build (MinIO publishes no official image any more; the Bitnami legacy mirror used before is
    # archived and unpatched: 26 CRITICAL vulnerabilities). Runs as the non-root user 65532. S3 API on 9000, console on 9001.
    # Rescan (Trivy) on each update; this tag moves, pin a digest in your own deployment.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER in .env - run sh scripts/init-env.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD in .env - run sh scripts/init-env.sh}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # The image has no curl or wget: probe liveness through bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r line <&3 && [[ "$$line" == *200* ]]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    security_opt: ["no-new-privileges:true"]
    # SignalR backplane (live updates across several API servers) AND the shared rate-limit counters. No data worth keeping (no snapshot, no
    # append-only file), no published port, password required: it is reachable only from the other containers, and only with the password.
    image: redis:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy volatile-ttl"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env - run sh scripts/init-env.sh}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Supervision (profile `observability`): everything runs on your own machine, nothing is sent to a third party. -------------------------------------
  #   docker compose --profile observability up -d     then set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 in .env and restart the api.
  #   Grafana http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD), Prometheus :9090, Alertmanager :9093, Jaeger :16686, alert e-mails in Mailpit :8025.
  otel-collector:
    security_opt: ["no-new-privileges:true"]
    image: otel/opentelemetry-collector-contrib:0.163.1
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    security_opt: ["no-new-privileges:true"]
    # Rescan on update: the upstream image carries fixable HIGH findings in its Go libraries (Trivy, 2026-10-21). Local port only.
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle"]
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [otel-collector, alertmanager, blackbox]

  alertmanager:
    security_opt: ["no-new-privileges:true"]
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./ops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  blackbox:
    user: "65534:65534"   # plain HTTP probes need no raw socket, so no root
    security_opt: ["no-new-privileges:true"]
    # Probes the site and the API from outside their processes, the way a load balancer or an uptime service would.
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./ops/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  grafana:
    security_opt: ["no-new-privileges:true"]
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD in .env - run sh scripts/init-env.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  jaeger:
    security_opt: ["no-new-privileges:true"]
    # Traces (which request was slow, which call failed). Jaeger v2, non-root; in-memory storage: a restart forgets them.
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686" # web UI

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web inbox
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./src/backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # No signing key is committed (the repository is public). Empty = a random key for this process; set JWT_SIGNING_KEY in .env for a stable one.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      # Encrypts the Data Protection keys (which protect every TOTP secret) at rest. Generated into .env by scripts/init-env.sh.
      DataProtection__KeyEncryptionKey: ${DATA_PROTECTION_KEK:-}
      # The API is only reachable through the web container's nginx: trust its X-Forwarded-* headers (real client IP for rate limits).
      Proxy__TrustForwardedHeaders: "true"
      # Development relay: every e-mail the API sends shows up in the Mailpit inbox (http://localhost:8025).
      # Payments: the simulated gateway by default; see .env.example to try the WiniPayer TEST sandbox.
      Payments__Provider: ${PAYMENTS_PROVIDER:-Fake}
      Payments__Winipay__ApplyKey: ${WINIPAY_APPLY_KEY:-}
      Payments__Winipay__Token: ${WINIPAY_TOKEN:-}
      Payments__Winipay__Env: ${WINIPAY_ENV:-test}
      Payments__ApiBaseUrl: ${PAYMENTS_PUBLIC_URL:-http://localhost:4200}
      Payments__WebBaseUrl: ${PAYMENTS_PUBLIC_URL:-http://localhost:4200}
      Email__Provider: ${EMAIL_PROVIDER:-}
      # E-mails (account, confirmations, reminders) go through SMTP with MailKit. Locally: the mailpit test inbox (nothing leaves the machine).
      # Production: your relay, see docs/DEPLOYMENT.md §15 (SMTP_PASSWORD belongs in .env or the secrets directory only).
      Email__Smtp__Host: ${SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${SMTP_PORT:-1025}
      Email__Smtp__Security: ${SMTP_SECURITY:-None}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM:-noreply@keke-beauty.local}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-Keke Beauty}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=kekebeauty;Username=keke;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env - run sh scripts/init-env.sh}
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      # Fictional establishments for local demos only; never enable outside development.
      Database__SeedDemoData: "true"
      # Object storage (photos in public-media, identity documents in private-kyc). Same credentials as the minio service.
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER in .env}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD in .env}
      # Optional initial SuperAdmin (created only when both are set; it must enrol in 2FA at first sign-in).
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      # Optional Google sign-in (disabled until a Google OAuth client ID is provided).
      Auth__Google__Enabled: ${GOOGLE_AUTH_ENABLED:-false}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      # LeTexto (SMS and e-mail campaigns): configuration kept for later, switched off (the code stays, nothing is read from here).
      # LeTexto__Enabled: ${LETEXTO_ENABLED:-false}
      # LeTexto__ApiKey: ${LETEXTO_API_KEY:-}
      # LeTexto__SmsSender: ${LETEXTO_SMS_SENDER:-}
      # LeTexto__EmailFrom: ${LETEXTO_EMAIL_FROM:-}
      # LeTexto__PublicApiUrl: ${PAYMENTS_PUBLIC_URL:-http://localhost:4200}
      # LeTexto__WebhookSecret: ${LETEXTO_WEBHOOK_SECRET:-}
      # WhatsApp through Zavu (https://docs.zavu.dev). Log = nothing is sent (default). Zavu = approved Meta templates, see docs/DEPLOYMENT.md §14.
      WhatsApp__Provider: ${WHATSAPP_PROVIDER:-Log}
      Zavu__ApiKey: ${ZAVU_API_KEY:-}
      Zavu__SenderId: ${ZAVU_SENDER_ID:-}
      Zavu__WebhookSecret: ${ZAVU_WEBHOOK_SECRET:-}
      Zavu__BaseUrl: ${ZAVU_BASE_URL:-https://api.zavu.dev}
      # Sign in with a one-time code sent by WhatsApp to a linked number (needs WHATSAPP_PROVIDER=Zavu and an approved keke_otp template).
      Auth__WhatsApp__Enabled: ${WHATSAPP_LOGIN_ENABLED:-false}
      # Web Push (VAPID). Empty = keys are generated once and kept in the database.
      Push__PublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      Push__PrivateKey: ${PUSH_VAPID_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_VAPID_SUBJECT:-mailto:contact@kekebeauty.example}
      # Several API servers: SignalR relays through Redis.
      # Empty = no shared state (a single API instance). In production put the whole connection string in the keystore (host:6380,ssl=true,password=...).
      Redis__ConnectionString: ${REDIS_CONNECTION:-redis:6379,password=${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env - run sh scripts/init-env.sh}}
      # OpenTelemetry traces and metrics: empty = off. With the `observability` profile use http://jaeger:4317.
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Database backups taken by the SuperAdmin from the back-office; ScheduledEnabled adds a nightly one.
      Backups__ScheduledEnabled: ${BACKUPS_SCHEDULED:-false}
      Backups__RetentionDays: ${BACKUPS_RETENTION_DAYS:-14}
      Media__MaxVideoMegabytes: ${MEDIA_MAX_VIDEO_MB:-50}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The aspnet runtime image has no curl/wget; probe liveness through bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/live HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q 200
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    build: ./src/frontend/keke-beauty-web
    restart: unless-stopped
    environment:
      # Yango: empty = the official go.link route (opens the Yango app on a phone); `off` hides the option.
      YANGO_URL_TEMPLATE: ${YANGO_URL_TEMPLATE:-}
      # Map tiles: empty = OpenStreetMap (development). In production use a provider with a service-level agreement.
      MAP_TILES_URL: ${MAP_TILES_URL:-}
      MAP_TILES_ATTRIBUTION: ${MAP_TILES_ATTRIBUTION:-}
      # Lets the browser load Google sign-in's script (CSP); must match the API's Auth__Google__Enabled.
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      # Addresses/CIDRs of the TLS terminator in front of this container (Caddy...), so that visitors keep their own rate-limit counter. Empty = none.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:     # old volume (Debian 11 PostGIS 3.4): kept until the migration is verified, then remove it with `docker volume rm keke-beauty_pgdata`
  pgdata_d13:
  miniodata:
  promdata:
  grafanadata:

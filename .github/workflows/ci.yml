name: CI

on:
  push:
    branches: [main, v1.0.1]
  pull_request:

# Least privilege: the jobs only read the repository. Actions are pinned to a full commit (a moved tag cannot change what runs);
# Dependabot proposes the updates.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # The repository is public: no key, token or password may be committed, not even a test one. Known historical findings are in
    # .gitleaks-baseline.json (revoked and never reused); anything new fails the build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan history and files for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact -c /repo/.gitleaks.toml --baseline-path /repo/.gitleaks-baseline.json
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --no-banner --redact -c /repo/.gitleaks.toml

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build KekeBeauty.sln --configuration Release
      # Known vulnerabilities in direct and transitive packages fail the build (the command itself always exits 0, so read its output).
      - name: Audit NuGet packages
        run: |
          dotnet list KekeBeauty.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then echo "Vulnerable NuGet packages found"; exit 1; fi
      - run: dotnet format KekeBeauty.sln --verify-no-changes --no-restore
      # Integration tests start PostGIS through Testcontainers (Docker is available on ubuntu-latest).
      - run: dotnet test KekeBeauty.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/frontend/keke-beauty-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/keke-beauty-web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --no-watch
      - run: npx ng build

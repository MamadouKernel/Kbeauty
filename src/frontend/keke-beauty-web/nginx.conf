# The TLS-terminating load balancer (or Caddy/Traefik in front of this container) tells us the original scheme.
map $http_x_forwarded_proto $fwd_proto {
  default $scheme;
  https   https;
}

map $fwd_proto $hsts_header {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

# Map tiles are fetched by this server and cached, so browsers only ever talk to the site's own origin: no third-party host to
# block, no CSP to keep in sync, and each tile is downloaded from the provider once.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=500m inactive=30d use_temp_path=off;

server {
  listen 80;
  server_tokens off;

  # Resolve the API's address on every request (not once at startup): after the API container is recreated its IP changes,
  # and a name resolved at startup would answer 502 until nginx is restarted. The DNS server comes from /etc/resolv.conf
  # (written at container start by docker/40-runtime-config.sh), so this works with Docker, Kubernetes or any other platform.
  include /etc/nginx/resolver.inc;
  # Sets $csp_map_tiles (the configured map tile host, see docker/40-runtime-config.sh).
  include /etc/nginx/map-tiles.inc;
  set $api_upstream http://api:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Same-origin API: the browser never needs CORS in the containerised setup.
  location /api/ {
    # Photos (10 MB), identity documents and videos (up to 64 MB, see PartnerEndpoints.VideoRequestLimit); nginx's default is 1 MB.
    client_max_body_size 70m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    # The API sets the same security headers as this proxy: keep one copy of each (the proxy's) instead of a doubled value.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # SignalR (real-time calendar, agenda and notifications): WebSocket upgrade, long-lived connections.
  location /hubs/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 1h;
  }

  location /health {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # OpenStreetMap tiles, see docker/40-runtime-config.sh. Only numeric z/x/y are forwarded. OpenStreetMap's usage policy asks
  # for an identifying User-Agent and for caching (both done here); for heavy traffic configure a provider with MAP_TILES_URL.
  # (CARTO's free tiles now answer "API KEY REQUIRED" images.)
  location ~ "^/tiles/(?<tz>\d{1,2})/(?<tx>\d{1,7})/(?<ty>\d{1,7})\.png$" {
    proxy_pass https://tile.openstreetmap.org/$tz/$tx/$ty.png;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.openstreetmap.org;
    # In production put the site's address or a contact in this identifier, as the OpenStreetMap policy asks.
    proxy_set_header User-Agent "KekeBeauty/1.0 (self-hosted tile cache)";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_cache tiles;
    proxy_cache_valid 200 30d;
    proxy_cache_valid any 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Anything else under /tiles/ is not a tile (regex locations are tried in order, after the one above).
  location ~ ^/tiles/ {
    return 404;
  }

  # Runtime settings are generated per container and must never be cached.
  location = /config.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The service worker and its manifest must always be revalidated or updates would never reach the users.
  location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Content-hashed bundles and fonts are safe to cache forever; index.html and brand images are not hashed.
  location ~* \.(?:js|css|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}

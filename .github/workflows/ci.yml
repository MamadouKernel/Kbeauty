name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build KekeBeauty.sln --configuration Release
      - run: dotnet format KekeBeauty.sln --verify-no-changes --no-restore
      # Integration tests start PostGIS through Testcontainers (Docker is available on ubuntu-latest).
      - run: dotnet test KekeBeauty.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/keke-beauty-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/keke-beauty-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --no-watch
      - run: npx ng build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    # The repository is public: no key, token or password may be committed, not even a test one. Known historical findings are in
    # .gitleaks-baseline.json (revoked and never reused); anything new fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history and files for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact -c /repo/.gitleaks.toml --baseline-path /repo/.gitleaks-baseline.json
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --no-banner --redact -c /repo/.gitleaks.toml

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build KekeBeauty.sln --configuration Release
      - run: dotnet format KekeBeauty.sln --verify-no-changes --no-restore
      # Integration tests start PostGIS through Testcontainers (Docker is available on ubuntu-latest).
      - run: dotnet test KekeBeauty.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/keke-beauty-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/keke-beauty-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --no-watch
      - run: npx ng build
